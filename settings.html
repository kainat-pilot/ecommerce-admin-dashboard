<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Settings</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <aside class="sidebar">
        <div class="brand-logo">⚡ <span>ShopAdmin</span></div>
        <ul class="nav-menu">
            <li><a href="index.html">📊 <span>Dashboard</span></a></li>
            <li><a href="products.html">📦 <span>Products</span></a></li>
            <li><a href="orders.html">🛒 <span>Orders</span></a></li>
            <li><a href="customers.html">👥 <span>Customers</span></a></li>
            <li><a href="reports.html">📈 <span>Reports</span></a></li>
            <li class="active"><a href="settings.html">⚙️ <span>Settings</span></a></li>
        </ul>
        <div class="sidebar-footer">
            <a href="#" class="logout-btn">🚪 <span>Logout</span></a>
        </div>
    </aside>

    <div class="main-wrapper">
        <header class="top-navbar">
            <div class="search-box">
                <input type="text" placeholder="Search settings...">
            </div>
            <div class="nav-profile">
                <div class="notification-icon">🔔</div>
                <div class="profile-info">
                    <div class="profile-avatar">A</div>
                    <span>Admin Name ▾</span>
                </div>
            </div>
        </header>

        <main class="content">
            <div class="page-header">
                <h1 class="page-title">Settings</h1>
            </div>

            <div class="table-card">
                <h3>Profile Settings</h3>
                <br>
                <form class="form-grid">
                    <div class="form-group">
                        <label>Admin Name</label>
                        <input type="text" value="Admin Name">
                    </div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" value="admin@example.com">
                    </div>
                    <div class="form-group">
                        <label>New Password</label>
                        <input type="password" placeholder="••••••••">
                    </div>
                </form>
                <br>
                <button class="btn">Save Changes</button>
            </div>
        </main>
    </div>

</body>
</html>
